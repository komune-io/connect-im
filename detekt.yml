# The exceptions this repository takes from the fixers Detekt configuration, read on top of it.
# A key here replaces the same key underneath, lists included: an `excludes` restates the rule's
# default excludes. A decision local to one site stays a reasoned @Suppress at that site.

complexity:
  ComplexInterface:
    excludes:
      # A domain DTO interface declares one member per field of the JSON and TypeScript contract.
      - '**/*-domain/src/commonMain/**'
  ReplaceSafeCallChainWithRun:
    # Its `x?.run { member }` resolves names against the receiver, and the `?.let` form is refused
    # by UnnecessaryLet: a safe-call chain says the same thing plainly.
    active: false

naming:
  BooleanPropertyNaming:
    excludes:
      # A domain field name is not ours to rename: the F2 DTOs carry the JSON and TypeScript
      # contract consumers read and send (withDisabled, sendResetPassword, ...), and the core
      # models take Keycloak's own names (enabled, ...).
      - '**/*-domain/src/commonMain/**'

style:
  UnnecessaryParentheses:
    # Parentheses that spell out how `||` and `&&`, or `?:` and a comparison, group are kept.
    allowForUnclearPrecedence: true
