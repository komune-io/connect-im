services:
  im-keycloak:
    image: ${DOCKER_REPOSITORY}im-keycloak:${VERSION_IM}
    container_name: ${KC_HOSTNAME}
    environment:
      KC_DB_URL: 'jdbc:postgresql://im-keycloak-postgres/im-keycloak'
      KC_DB_PASSWORD: admin
      KC_DB_USERNAME: admin
      KC_DB_SCHEMA: public
      KC_HOSTNAME: ${AUTH_HOST_URL}
      KEYCLOAK_FRONTEND_URL: ${AUTH_HOST_URL}
      KEYCLOAK_ADMIN: ${KC_ROOT_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ROOT_PASS}
      PROXY_ADDRESS_FORWARDING: "true"
      JDBC_PARAMS: "ssl=false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
#    command:
#      - "--log-level=trace"
    ports:
      - '8080:8080'
    networks:
      - net
    depends_on:
      - im-keycloak-postgres
    # `make dev up` used to start im-init as soon as this container existed, which raced
    # Keycloak's boot; on 26.7 the race became deterministic (~21s to serve, im-init
    # connected at ~13s). dev-compose.mk waits on this healthcheck before moving on.
    #
    # Probes the public HTTP port rather than the management port: this compose file runs
    # a *published* image, and health on port 9000 is a build-time option that image was
    # not built with. The image ships no curl or wget, hence bash's /dev/tcp.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /realms/master HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  im-keycloak-postgres:
    image: postgres
    container_name: im-keycloak-postgres
    environment:
      POSTGRES_DB: im-keycloak
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    networks:
      - net

  connect-fake-smtp:
    container_name: ${SMTP_HOST}
    image: reachfive/fake-smtp-server:latest
    platform: linux/amd64
    ports:
      - "${SMTP_PORT}:1025"
      - "1080:1080"
    networks:
      - net

networks:
  net:
    name: ${DOCKER_NETWORK}
    external: true
